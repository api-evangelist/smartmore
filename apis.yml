x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    SmartMore sells the SMore ViMo vision platform and its own camera/sensor hardware as licensed
    end-user products and publishes no developer surface at all — api., developer. and docs.smartmore.com
    do not resolve in DNS, every /.well-known/ path on global., inside., cn. and www.smartmore.com
    returns a hard 404, no OpenAPI/Swagger/GraphQL/AsyncAPI contract exists on any host, and the
    "export to SDK" ViMo Deeplearning advertises has no public download, reference, or package in npm,
    PyPI or crates.io. (The platform answers HTTP 200 with an empty body for arbitrary non-existent
    file paths, so a 200 from these hosts is a catch-all, not a document.)
