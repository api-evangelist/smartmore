aid: smartmore
name: SmartMore
description: >-
  SmartMore Corporation (思谋科技) is a Hong Kong- and Shenzhen-headquartered industrial AI and machine
  vision company founded in 2019, building products and solutions for smart manufacturing and digital
  innovation. Its flagship SMore ViMo platform bundles ViMo Cloud, ViMo Deeplearning and ViMo Studio
  into a low-code industrial vision stack covering data management, model training, visual solution
  design and production-line deployment, and is sold alongside first-party hardware — industrial smart
  cameras, barcode readers (VS600/VS800P/VS1000/VS2000), vision sensors (VN2000/VN4000) and lenses —
  through the SmartMoreInside sub-brand. The company also markets digital platforms (Light3D, Data,
  Gauge, AIoT) and industrial large models (IndustryGPT, SMore LrMo). SmartMore states it has filed
  400+ global patent applications with 200+ granted, served 200+ enterprise customers, and reached
  unicorn status on a Series B that exceeded USD 200 million in 2021, with R&D and business centers in
  Hong Kong, Shenzhen, Shanghai, Suzhou, Tokyo, Beijing, Hangzhou and Singapore. As of this pass the
  company publishes no public developer program, API reference or machine-readable contract; ViMo model
  export to an SDK is described in marketing copy but is delivered with the licensed product rather
  than documented publicly.
